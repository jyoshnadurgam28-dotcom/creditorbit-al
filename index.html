<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CreditOrbit AI — Where Credit Meets Intelligent Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #080B1A;
    --navy-raised: #0E1226;
    --navy-card: #10142B;
    --navy-card-2: #141935;
    --line: rgba(248,250,252,0.08);
    --line-strong: rgba(248,250,252,0.14);
    --indigo: #6C63FF;
    --cyan: #00D4FF;
    --purple: #A855F7;
    --white: #F8FAFC;
    --muted: #9AA3C0;
    --muted-2: #6C7599;
    --good: #35D399;
    --warn: #F5B942;
    --bad: #FF6B6B;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }

  * { box-sizing: border-box; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: var(--font-body);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, .display { font-family: var(--font-display); letter-spacing: -0.01em; }
  p { line-height: 1.6; color: var(--muted); }
  a { color: inherit; }
  button { font-family: var(--font-body); cursor: pointer; }
  ::selection { background: rgba(108,99,255,0.35); }

  /* ---------- background orbit field ---------- */
  .orbit-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(108,99,255,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 10%, rgba(0,212,255,0.10), transparent 60%),
      radial-gradient(ellipse 800px 700px at 50% 110%, rgba(168,85,247,0.10), transparent 60%),
      var(--navy);
  }
  .orbit-field svg { position:absolute; inset:0; width:100%; height:100%; opacity:0.5; }
  .star { fill: #ffffff; opacity: 0.35; }

  /* ---------- layout shell ---------- */
  #app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 6vw;
    background: rgba(8,11,26,0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand-mark {
    width:34px; height:34px; border-radius: 10px;
    background: conic-gradient(from 210deg, var(--indigo), var(--cyan), var(--purple), var(--indigo));
    position: relative; flex: none;
  }
  .brand-mark::after {
    content:""; position:absolute; inset:8px; border-radius:50%;
    background: var(--navy);
  }
  .brand-name { font-family: var(--font-display); font-weight:600; font-size:1.05rem; }
  .brand-name small { display:block; font-family: var(--font-body); font-weight:400; font-size:0.68rem; color: var(--muted-2); margin-top:1px; }

  .topbar-progress { display:none; align-items:center; gap:10px; font-size:0.8rem; color:var(--muted); }
  .topbar-progress .dot { width:7px; height:7px; border-radius:50%; background: var(--line-strong); transition: background .25s, transform .25s; }
  .topbar-progress .dot.done { background: var(--cyan); }
  .topbar-progress .dot.active { background: var(--indigo); transform: scale(1.4); }

  main#screen-root { flex:1; }
  .screen { display:none; animation: fadeIn .45s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 6vw; }
  .wrap-narrow { max-width: 760px; margin: 0 auto; padding: 0 6vw; }

  /* ---------- buttons ---------- */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;
    font-size: 0.95rem; font-weight: 600; font-family: var(--font-body);
    transition: transform .15s ease, box-shadow .2s ease, opacity .15s ease, background .2s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(120deg, var(--indigo), var(--cyan));
    color: #050716;
    box-shadow: 0 8px 30px -8px rgba(108,99,255,0.55);
  }
  .btn-primary:hover { box-shadow: 0 10px 34px -6px rgba(0,212,255,0.55); }
  .btn-ghost {
    background: rgba(248,250,252,0.04);
    border-color: var(--line-strong);
    color: var(--white);
    backdrop-filter: blur(6px);
  }
  .btn-ghost:hover { background: rgba(248,250,252,0.08); border-color: rgba(0,212,255,0.4); }
  .btn-text { background:none; color: var(--muted); padding: 10px 6px; font-weight:600; }
  .btn-text:hover { color: var(--white); }
  .btn[disabled] { opacity:0.4; cursor:not-allowed; }
  .btn-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .btn svg { width:16px; height:16px; }

  /* ---------- cards ---------- */
  .card {
    background: linear-gradient(180deg, var(--navy-card), var(--navy-card-2));
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 26px;
  }
  .card-glass {
    background: rgba(248,250,252,0.035);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-md);
    padding: 26px;
  }
  .glow-icon {
    width:46px; height:46px; border-radius: 13px; display:flex; align-items:center; justify-content:center;
    font-size:1.35rem; margin-bottom:16px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.25);
    box-shadow: 0 0 24px -6px rgba(0,212,255,0.5);
  }
  .glow-icon.purple { background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.3); box-shadow: 0 0 24px -6px rgba(168,85,247,0.5); }
  .glow-icon.indigo { background: rgba(108,99,255,0.10); border-color: rgba(108,99,255,0.3); box-shadow: 0 0 24px -6px rgba(108,99,255,0.5); }

  /* ---------- section rhythm ---------- */
  section.block { padding: 84px 0; }
  .eyebrow-row { display:flex; align-items:center; gap:10px; margin-bottom: 14px; }
  .kicker { font-size: 0.82rem; color: var(--cyan); font-weight:600; }
  h2.section-title { font-size: clamp(1.7rem, 3.4vw, 2.5rem); margin: 0 0 10px; }
  .section-sub { max-width: 620px; font-size: 1.02rem; }

  /* ---------- footer ---------- */
  footer.site-footer {
    border-top: 1px solid var(--line);
    padding: 56px 0 40px;
    margin-top: 20px;
  }
  .footer-grid { display:flex; flex-wrap:wrap; justify-content:space-between; gap:40px; }
  .footer-links { display:flex; gap:22px; font-size:0.88rem; color: var(--muted); flex-wrap:wrap; }
  .footer-links a:hover { color: var(--cyan); }
  .footer-bottom { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); font-size:0.8rem; color: var(--muted-2); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  /* ---------- forms ---------- */
  .field { margin-bottom: 22px; }
  .field label { display:block; font-size:0.85rem; font-weight:600; color: var(--white); margin-bottom:8px; }
  .field .hint { font-size:0.76rem; color: var(--muted-2); margin-top:6px; }
  .field .error { font-size:0.78rem; color: var(--bad); margin-top:6px; display:none; }
  .field.has-error .error { display:block; }
  .field.has-error input, .field.has-error select { border-color: var(--bad) !important; }
  input[type="text"], input[type="number"], input[type="email"], select {
    width:100%; padding: 13px 14px; border-radius: var(--radius-sm);
    background: rgba(248,250,252,0.04); border: 1px solid var(--line-strong);
    color: var(--white); font-size: 0.95rem; font-family: var(--font-body);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted-2); }
  input:focus, select:focus, textarea:focus {
    border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
  }
  select { appearance:none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none'><path d='M2 4l5 5 5-5' stroke='%239AA3C0' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position: right 14px center; padding-right: 36px;
  }
  textarea {
    width:100%; padding:13px 14px; border-radius: var(--radius-sm); min-height:120px; resize:vertical;
    background: rgba(248,250,252,0.04); border:1px solid var(--line-strong); color:var(--white);
    font-family: var(--font-body); font-size:0.95rem; outline:none;
  }
  .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

  input[type="range"] {
    width:100%; -webkit-appearance:none; height:6px; border-radius:4px;
    background: linear-gradient(90deg, var(--indigo), var(--cyan)); outline:none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background: var(--white); border: 3px solid var(--indigo); cursor:pointer; margin-top:-6px;
  }
  input[type="range"]::-moz-range-thumb {
    width:18px; height:18px; border-radius:50%; background: var(--white); border:3px solid var(--indigo); cursor:pointer;
  }
  .range-value { font-family: var(--font-display); font-weight:600; color: var(--cyan); }

  /* ---------- progress bar (form flow) ---------- */
  .progress-shell { margin-bottom: 34px; }
  .progress-track { height:6px; border-radius:4px; background: rgba(248,250,252,0.08); overflow:hidden; }
  .progress-fill { height:100%; background: linear-gradient(90deg, var(--indigo), var(--cyan)); border-radius:4px; transition: width .4s ease; }
  .progress-label { display:flex; justify-content:space-between; font-size:0.78rem; color: var(--muted-2); margin-top:10px; }

  /* ---------- metric cards ---------- */
  .metric-card {
    border-radius: var(--radius-md); padding: 22px; border:1px solid var(--line);
    background: rgba(248,250,252,0.03);
  }
  .metric-card .metric-label { font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .metric-card .metric-value { font-family: var(--font-display); font-size:1.8rem; font-weight:600; margin: 8px 0 10px; }
  .meter-track { height:8px; border-radius:6px; background: rgba(248,250,252,0.08); overflow:hidden; }
  .meter-fill { height:100%; border-radius:6px; }

  .tip {
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; border:1px solid var(--muted-2); color:var(--muted-2);
    font-size:0.68rem; margin-left:6px; cursor:help;
  }
  .tip .tip-bubble {
    display:none; position:absolute; bottom:130%; left:50%; transform:translateX(-50%);
    width:220px; background: #171c3d; border:1px solid var(--line-strong); border-radius:10px;
    padding:10px 12px; font-size:0.76rem; color: var(--muted); z-index: 30; line-height:1.5;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.6);
  }
  .tip:hover .tip-bubble, .tip:focus .tip-bubble { display:block; }

  .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:0.75rem; font-weight:600; }
  .badge-low { background: rgba(53,211,153,0.12); color: var(--good); border:1px solid rgba(53,211,153,0.3); }
  .badge-medium { background: rgba(245,185,66,0.12); color: var(--warn); border:1px solid rgba(245,185,66,0.3); }
  .badge-high { background: rgba(255,107,107,0.12); color: var(--bad); border:1px solid rgba(255,107,107,0.3); }
  .badge-best { background: rgba(0,212,255,0.14); color: var(--cyan); border:1px solid rgba(0,212,255,0.35); }

  table.perf-table { width:100%; border-collapse: collapse; font-size:0.88rem; }
  table.perf-table th, table.perf-table td { padding: 13px 14px; text-align:left; border-bottom:1px solid var(--line); }
  table.perf-table th { color: var(--muted); font-weight:600; font-size:0.76rem; text-transform:none; }
  table.perf-table tr.best-row td { background: rgba(0,212,255,0.05); }
  .table-scroll { overflow-x:auto; }

  .loading-overlay {
    position:fixed; inset:0; z-index:100; background: rgba(8,11,26,0.92); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px;
  }
  .loading-overlay[hidden] { display:none; }
  .orbit-spinner { width:76px; height:76px; position:relative; }
  .orbit-spinner .ring { position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color: var(--cyan); border-right-color: var(--indigo); animation: spin 1.1s linear infinite; }
  .orbit-spinner .ring2 { inset:14px; border-top-color: var(--purple); border-right-color:transparent; border-bottom-color: var(--cyan); animation-duration: 1.6s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .review-section { margin-bottom: 26px; }
  .review-section h4 { display:flex; justify-content:space-between; align-items:center; margin: 0 0 14px; font-size:1rem; }
  .review-grid { display:grid; grid-template-columns: repeat(2,1fr); gap: 10px 24px; }
  @media (max-width:640px) { .review-grid { grid-template-columns:1fr; } }
  .review-row { display:flex; justify-content:space-between; font-size:0.88rem; padding: 8px 0; border-bottom:1px dashed var(--line); }
  .review-row span:first-child { color: var(--muted); }

  .factor-bar-row { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .factor-bar-row .fname { width:170px; flex:none; font-size:0.85rem; }
  .factor-bar-track { flex:1; height:8px; border-radius:6px; background: rgba(248,250,252,0.07); overflow:hidden; }
  .factor-bar-fill { height:100%; border-radius:6px; }
  .factor-bar-val { width:56px; text-align:right; font-size:0.8rem; color:var(--muted); flex:none; }

  .tagline {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.3rem;
    background: linear-gradient(100deg, var(--indigo), var(--cyan) 55%, var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  ::-webkit-scrollbar { height:8px; width:8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius:8px; }

  @media (max-width:720px) {
    .topbar { padding: 14px 5vw; }
    section.block { padding: 56px 0; }
  }
</style>
</head>

<script>/* ===================== ML INFERENCE ENGINE =====================
   These functions replay the exact parameters of models trained offline
   with scikit-learn (Logistic Regression, Decision Tree, Random Forest)
   on a labeled credit-risk dataset. Nothing here is randomly generated —
   every prediction is the real output of the trained model's math,
   computed client-side from the coefficients / tree splits exported
   after training and testing. See "Model Performance" for the actual
   held-out test-set metrics recorded at training time. */
const M = window.MODEL_DATA;
const FEATURES = M.feature_names;

function encodeEmployment(v) {
  return { employed: 0, self_employed: 1, unemployed: 2, student: 3, retired: 4 }[v] ?? 0;
}
function encodeEducation(v) {
  return { high_school: 0, bachelors: 1, masters: 2, doctorate: 3, other: 0 }[v] ?? 0;
}

function buildFeatureVector(d) {
  const dti = d.monthly_income > 0 ? d.existing_debt / d.monthly_income : 0;
  const lti = d.monthly_income > 0 ? d.loan_amount / d.monthly_income : 0;
  const vec = {
    age: d.age,
    employment_status: encodeEmployment(d.employment_status),
    employment_length: d.employment_length,
    monthly_income: d.monthly_income,
    dependents: d.dependents,
    education: encodeEducation(d.education),
    existing_debt: d.existing_debt,
    loan_amount: d.loan_amount,
    loan_term: d.loan_term,
    num_existing_loans: d.num_existing_loans,
    monthly_expenses: d.monthly_expenses,
    dti: dti,
    lti: lti,
    credit_history_length: d.credit_history_length,
    missed_payments: d.missed_payments,
    on_time_payments: d.on_time_payments,
    credit_utilization: d.credit_utilization,
    previous_defaults: d.previous_defaults,
    payment_history_rating: d.payment_history_rating,
  };
  return FEATURES.map(f => vec[f]);
}

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

function predictLogReg(x) {
  const { mean, scale } = M.scaler;
  const { coef, intercept } = M.logreg;
  let z = intercept;
  for (let i = 0; i < x.length; i++) {
    const xs = (x[i] - mean[i]) / scale[i];
    z += xs * coef[i];
  }
  return sigmoid(z);
}

function walkTree(node, x) {
  let n = node;
  while (!n.leaf) {
    n = (x[n.f] <= n.thr) ? n.l : n.r;
  }
  return n.p;
}

function predictTree(x) { return walkTree(M.dtree, x); }

function predictForest(x) {
  const trees = M.rforest;
  let sum = 0;
  for (const t of trees) sum += walkTree(t, x);
  return sum / trees.length;
}

function bestModelName() {
  const entries = Object.entries(M.metrics);
  entries.sort((a, b) => b[1].roc_auc - a[1].roc_auc);
  return entries[0][0];
}

function predictWithModel(name, x) {
  if (name === 'Logistic Regression') return predictLogReg(x);
  if (name === 'Decision Tree') return predictTree(x);
  return predictForest(x);
}

function riskCategory(prob) {
  if (prob < 0.35) return 'Low Risk';
  if (prob < 0.65) return 'Medium Risk';
  return 'High Risk';
}

function riskScoreFromProb(prob) {
  // Familiar 300-900 style score, higher = lower risk. Deterministic transform of the model's own probability.
  return Math.round(300 + (1 - prob) * 600);
}

// Logistic-regression-based factor contributions (linear, so directly interpretable)
// used to explain any of the three models' predictions to the user.
function factorContributions(x) {
  const { mean, scale } = M.scaler;
  const { coef } = M.logreg;
  const rows = FEATURES.map((f, i) => {
    const xs = (x[i] - mean[i]) / scale[i];
    return { feature: f, contribution: xs * coef[i] };
  });
  rows.sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution));
  return rows;
}

  payment_history_rating: 'Payment History Rating',
};

function runFullAssessment(formData) {
  const x = buildFeatureVector(formData);
  const best = bestModelName();
  const probs = {
    'Logistic Regression': predictLogReg(x),
    'Decision Tree': predictTree(x),
    'Random Forest': predictForest(x),
  };
  const prob = probs[best];
  return {
    modelUsed: best,
    probability: prob,
    confidence: Math.max(prob, 1 - prob),
    category: riskCategory(prob),
    score: riskScoreFromProb(prob),
    allModelProbabilities: probs,
    factors: factorContributions(x),
    dti: x[FEATURES.indexOf('dti')],
    lti: x[FEATURES.indexOf('lti')],
  };
}

function renderField(def) {
  const val = State.formData[def.id];
  const tip = def.tooltip ? `<span class="tip" tabindex="0">i<span class="tip-bubble">${def.tooltip}</span></span>` : '';
  let control = '';
  if (def.type === 'select') {
    control = `<select id="f_${def.id}" data-field="${def.id}">` +
      def.options.map(([v,l]) => `<option value="${v}" ${String(val)===String(v)?'selected':''}>${l}</option>`).join('') +
      `</select>`;
  } else if (def.type === 'slider') {
    control = `<div style="display:flex; align-items:center; gap:14px;">
      <input type="range" id="f_${def.id}" data-field="${def.id}" min="${def.min}" max="${def.max}" step="${def.step}" value="${val}">
      <span class="range-value" id="fv_${def.id}">${val}${def.unit||''}</span>
    </div>`;
  } else {
    control = `<input type="number" id="f_${def.id}" data-field="${def.id}" min="${def.min ?? ''}" max="${def.max ?? ''}" step="${def.step || 1}" value="${val}" placeholder="${def.placeholder||''}">`;
  }
  return `<div class="field" id="field_${def.id}">
    <label for="f_${def.id}">${def.label}${tip}</label>
    ${control}
    <div class="error" id="err_${def.id}"></div>
  </div>`;
}

function bindFieldEvents(container) {
  container.querySelectorAll('[data-field]').forEach(el => {
    const id = el.dataset.field;
    const evt = (el.tagName === 'SELECT') ? 'change' : 'input';
    el.addEventListener(evt, () => {
      let v = el.value;
      const def = FIELD_DEFS.find(d => d.id === id);
      if (def && (def.type === 'number' || def.type === 'slider')) v = v === '' ? '' : parseFloat(v);
      else if (id === 'loan_term') v = parseFloat(v);
      State.formData[id] = v;
      if (def && def.type === 'slider') {
        const disp = document.getElementById('fv_' + id);
        if (disp) disp.textContent = v + (def.unit || '');
      }
      clearFieldError(id);
      if (State.screen === 4) refreshRatios();
    });
  });
}

function clearFieldError(id) {
  const f = document.getElementById('field_' + id);
  if (f) f.classList.remove('has-error');
}
function setFieldError(id, msg) {
  const f = document.getElementById('field_' + id);
  const e = document.getElementById('err_' + id);
  if (f && e) { f.classList.add('has-error'); e.textContent = msg; }
}

function validateScreen(screen) {
  let ok = true;
  fieldDefsFor(screen).forEach(def => {
    if (def.type === 'slider') return; // sliders always have a valid value
    const v = State.formData[def.id];
    if (def.required && (v === '' || v === null || v === undefined || Number.isNaN(v))) {
      setFieldError(def.id, 'This field is required.');
      ok = false;
    } else if (def.type === 'number' && (v < def.min || (def.max !== undefined && v > def.max))) {
      setFieldError(def.id, `Enter a value between ${def.min} and ${def.max ?? '∞'}.`);
      ok = false;
    } else {
      clearFieldError(def.id);
    }
  });
  return ok;
}

      <div class="review-row"><span>Loan-to-Income Ratio</span><span>${lti.toFixed(2)}x</span></div>
    </div>
  </div>
  `;
  return `
  <section class="block" style="padding-top:56px;">
    <div class="wrap-narrow">
      <div class="progress-shell"><div class="progress-track"><div class="progress-fill" style="width:80%;"></div></div>
        <div class="progress-label"><span>Step 4 of 5</span><span>Review & Predict</span></div></div>
      <h2 class="section-title">Review & Predict</h2>
      <p class="section-sub" style="margin-bottom:30px;">Double-check your details, then run the assessment through the trained model.</p>
      ${body}
      <div class="btn-row" style="justify-content:space-between; margin-top:28px;">
        <button class="btn btn-ghost" onclick="Nav.go(5)">${backIcon()} Back</button>
        <button class="btn btn-primary" onclick="FormFlow.analyze()">Analyze Credit Risk ${arrowIcon()}</button>
      </div>
    </div>
  </section>`;
}

/* ===================== SCREEN 7 — RESULT ===================== */
function badgeClassFor(cat) { return cat==='Low Risk' ? 'badge-low' : cat==='Medium Risk' ? 'badge-medium' : 'badge-high'; }
function colorForCat(cat) { return cat==='Low Risk' ? 'var(--good)' : cat==='Medium Risk' ? 'var(--warn)' : 'var(--bad)'; }

function renderScreen7() {
  const r = State.result;
  if (!r) return `<section class="block"><div class="wrap-narrow"><p>No assessment yet. <a href="#" onclick="Nav.go(6); return false;">Go back</a>.</p></div></section>`;
  const pct = Math.round(r.probability*100);
  const color = colorForCat(r.category);
  const circumference = 2*Math.PI*70;
  const dash = (r.confidence)*circumference;

  const topFactors = r.factors.slice(0,5);
  const factorsHTML = topFactors.map(f => {
    const positive = f.contribution < 0; // negative contribution to risk = positive for applicant
    const width = Math.min(Math.abs(f.contribution)/Math.max(...topFactors.map(x=>Math.abs(x.contribution)))*100, 100);
    return `<div class="factor-bar-row">
      <div class="fname">${FEATURE_LABELS[f.feature]}</div>
      <div class="factor-bar-track"><div class="factor-bar-fill" style="width:${width}%; background:${positive?'var(--good)':'var(--bad)'};"></div></div>
      <div class="factor-bar-val" style="color:${positive?'var(--good)':'var(--bad)'}">${positive?'−':'+'}${Math.abs(f.contribution).toFixed(2)}</div>
    </div>`;
  }).join('');

  return `
  <section class="block" style="padding-top:56px;">
    <div class="wrap">
      <div style="text-align:center; margin-bottom:10px;"><span class="kicker">Assessment Complete</span></div>
      <h2 class="section-title" style="text-align:center;">Credit Risk Assessment</h2>

      <div style="display:grid; grid-template-columns: 320px 1fr; gap:50px; align-items:center; margin:50px 0;">
        <div style="position:relative; width:280px; height:280px; margin:0 auto;">
          <svg viewBox="0 0 180 180" width="280" height="280">
            <circle cx="90" cy="90" r="70" fill="none" stroke="rgba(248,250,252,0.08)" stroke-width="14"/>
            <circle cx="90" cy="90" r="70" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="${dash} ${circumference}" transform="rotate(-90 90 90)" style="filter:drop-shadow(0 0 10px ${color});"/>
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div class="badge ${badgeClassFor(r.category)}" style="margin-bottom:8px;">${r.category}</div>
            <div style="font-family:var(--font-display); font-size:2.2rem; font-weight:700;">${r.score}</div>
            <div style="font-size:0.76rem; color:var(--muted-2);">Risk Score</div>
          </div>
        </div>
        <div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px;">
            <div class="metric-card"><div class="metric-label">Risk Category</div><div class="metric-value" style="color:${color}; font-size:1.3rem;">${r.category}</div></div>
            <div class="metric-card"><div class="metric-label">Prediction Confidence</div><div class="metric-value" style="font-size:1.3rem;">${Math.round(r.confidence*100)}%</div></div>
            <div class="metric-card"><div class="metric-label">Model Used</div><div class="metric-value" style="font-size:1.3rem;">${r.modelUsed}</div></div>
          </div>
          <p>The model estimated a <strong style="color:var(--white)">${pct}% probability</strong> that this applicant profile falls into a higher-risk repayment category, based on patterns learned from historical test data.</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:30px;">
        <h3 style="margin-top:0;">Why did the model make this prediction?</h3>
        <p style="font-size:0.86rem;">Key contributing factors, ranked by influence on this specific prediction (green reduces risk, red increases it):</p>
        ${factorsHTML}
      </div>

      <div class="card-glass" style="border-color:rgba(245,185,66,0.35); margin-bottom:34px;">
        <strong style="color:var(--warn);">ML-Based Risk Assessment</strong>
        <p style="margin:6px 0 0; font-size:0.86rem;">This result does not guarantee loan approval or rejection. It reflects patterns learned by a statistical model and should be one input among several in any lending decision.</p>
      </div>

      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="Nav.go(8)">View Detailed Analysis ${arrowIcon()}</button>
        <button class="btn btn-ghost" onclick="FormFlow.restart()">Start New Assessment</button>
      </div>
    </div>
  </section>
  ${footerHTML(false)}`;
}

/* ===================== SCREEN 8 — DETAILED ANALYSIS ===================== */
function svgDonut(prob, color) {
  const c = 2*Math.PI*54;
  const dash = prob*c;
  return `<svg viewBox="0 0 140 140" width="140" height="140">
    <circle cx="70" cy="70" r="54" fill="none" stroke="rgba(248,250,252,0.08)" stroke-width="16"/>
    <circle cx="70" cy="70" r="54" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 70 70)"/>
    <text x="70" y="76" text-anchor="middle" font-family="Space Grotesk" font-size="22" fill="#F8FAFC" font-weight="600">${Math.round(prob*100)}%</text>
  </svg>`;
}
function svgBarChart(items, maxVal) {
  const w = 320, h = 150, bw = w/items.length - 18;
  const bars = items.map((it,i) => {
    const bh = Math.max((it.value/maxVal)*110, 4);
    const x = i*(w/items.length) + 9;
    const y = 120 - bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${it.color}"/>
      <text x="${x+bw/2}" y="136" text-anchor="middle" font-size="10" fill="#9AA3C0" font-family="Inter">${it.label}</text>
      <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="#F8FAFC" font-family="Inter" font-weight="600">${it.display}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="150">${bars}</svg>`;
}

function renderScreen8() {
  const r = State.result;
  if (!r) return `<section class="block"><div class="wrap-narrow"><p>No assessment yet. <a href="#" onclick="Nav.go(6); return false;">Go back</a>.</p></div></section>`;
  const d = State.formData;
  const color = colorForCat(r.category);
  const financialHealth = r.category === 'Low Risk' ? 'Strong' : r.category === 'Medium Risk' ? 'Fair' : 'Needs Attention';

  const posFactors = r.factors.filter(f=>f.contribution<0).slice(0,4);
  const riskFactors = r.factors.filter(f=>f.contribution>0).slice(0,4);

  const metricsRows = Object.entries(M.metrics).map(([name, m]) => {
    const isBest = name === r.modelUsed;
    return `<tr class="${isBest?'best-row':''}"><td>${name} ${isBest?'<span class="badge badge-best">Best</span>':''}</td>
      <td>${(m.accuracy*100).toFixed(1)}%</td><td>${(m.precision*100).toFixed(1)}%</td>
      <td>${(m.recall*100).toFixed(1)}%</td><td>${(m.f1*100).toFixed(1)}%</td><td>${m.roc_auc.toFixed(3)}</td></tr>`;
  }).join('');

  const financeItems = [
    {label:'DTI', value: Math.min(r.dti,1.2), display:(r.dti*100).toFixed(0)+'%', color:'var(--indigo)'},
    {label:'LTI', value: Math.min(r.lti/5,1.2), display:r.lti.toFixed(1)+'x', color:'var(--cyan)'},
    {label:'Utilization', value: d.credit_utilization/100, display:d.credit_utilization+'%', color:'var(--purple)'},
  ];
  const paymentItems = [
    {label:'On-Time', value: parseFloat(d.on_time_payments)||0, display:String(d.on_time_payments), color:'var(--good)'},
    {label:'Missed', value: parseFloat(d.missed_payments)||0, display:String(d.missed_payments), color:'var(--bad)'},
  ];
  const maxPayment = Math.max(...paymentItems.map(i=>i.value), 1);

  return `
  <section class="block" style="padding-top:56px;">
    <div class="wrap">
      <div class="eyebrow-row"><span class="kicker">Full Breakdown</span></div>
      <h2 class="section-title">Detailed Credit Analysis</h2>
      <p class="section-sub" style="margin-bottom:36px;">A complete view of the model's reasoning, your financial indicators, and how each model performed on real test data.</p>

      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:36px;">
        <div class="metric-card"><div class="metric-label">Overall Risk Score</div><div class="metric-value">${r.score}</div></div>
        <div class="metric-card"><div class="metric-label">Risk Category</div><div class="metric-value" style="color:${color}; font-size:1.3rem;">${r.category}</div></div>
        <div class="metric-card"><div class="metric-label">Prediction Probability</div><div class="metric-value">${Math.round(r.probability*100)}%</div></div>
        <div class="metric-card"><div class="metric-label">Financial Health</div><div class="metric-value" style="font-size:1.3rem;">${financialHealth}</div></div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:36px;">
        ${indicatorCard('Debt-to-Income Ratio', (r.dti*100).toFixed(1)+'%', Math.min(r.dti*100,100))}
        ${indicatorCard('Loan-to-Income Ratio', r.lti.toFixed(2)+'x', Math.min(r.lti*100/5,100))}
        ${indicatorCard('Payment History Rating', d.payment_history_rating+'/5', (d.payment_history_rating/5)*100)}
        ${indicatorCard('Credit Utilization', d.credit_utilization+'%', d.credit_utilization)}
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:40px;">
        <div class="card"><h4 style="margin-top:0; color:var(--bad);">Key Risk Factors</h4>
          ${riskFactors.length? riskFactors.map(f=>`<div class="review-row"><span>${FEATURE_LABELS[f.feature]}</span><span style="color:var(--bad)">+${f.contribution.toFixed(2)}</span></div>`).join('') : '<p style="font-size:0.85rem;">No significant risk-increasing factors detected.</p>'}
        </div>
        <div class="card"><h4 style="margin-top:0; color:var(--good);">Positive Factors</h4>
          ${posFactors.length? posFactors.map(f=>`<div class="review-row"><span>${FEATURE_LABELS[f.feature]}</span><span style="color:var(--good)">${f.contribution.toFixed(2)}</span></div>`).join('') : '<p style="font-size:0.85rem;">No significant risk-reducing factors detected.</p>'}
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:50px;">
        <div class="card" style="text-align:center;"><h4 style="margin-top:0;">Risk Probability</h4>${svgDonut(r.probability, color)}</div>
        <div class="card"><h4 style="margin-top:0;">Financial Profile</h4>${svgBarChart(financeItems, 1.2)}</div>
        <div class="card"><h4 style="margin-top:0;">Payment History</h4>${svgBarChart(paymentItems, maxPayment)}</div>
      </div>

      <div class="card" style="margin-bottom:50px;">
        <h3 style="margin-top:0;">Model Performance</h3>
        <p style="font-size:0.86rem;">Actual results measured on a held-out test set — not hard-coded. The best-performing model by ROC-AUC is used for your prediction above.</p>
        <div class="table-scroll">
        <table class="perf-table">
          <thead><tr><th>Model</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>F1-Score</th><th>ROC-AUC</th></tr></thead>
          <tbody>${metricsRows}</tbody>
        </table>
        </div>
      </div>

      <div class="btn-row" style="justify-content:center; margin-bottom:20px;">
        <button class="btn btn-ghost" onclick="Nav.go(7)">${backIcon()} Back to Result</button>
        <button class="btn btn-primary" onclick="FormFlow.restart()">Start New Assessment</button>
      </div>
    </div>
  </section>
  ${footerHTML(true)}
  `;
}
function indicatorCard(label, value, pct) {
  let color = 'linear-gradient(90deg,var(--indigo),var(--cyan))';
  if (pct > 66) color = 'var(--bad)'; else if (pct > 33) color = 'var(--warn)';
  return `<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value" style="font-size:1.3rem;">${value}</div>
    <div class="meter-track"><div class="meter-fill" style="width:${Math.min(pct,100)}%; background:${color};"></div></div></div>`;
}

/* ===================== FOOTER + CONTACT ===================== */
function footerHTML(withContact) {
  return `<footer class="site-footer"><div class="wrap">
    ${withContact ? `
    <div class="card" style="margin-bottom:40px;" id="contactCard">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:20px; margin-bottom:22px;">
        <div>
          <h3 style="margin:0 0 6px;">Have any queries?</h3>
          <p style="margin:0; font-size:0.88rem;">Reach us directly or send a message below.</p>
        </div>
        <a class="btn btn-ghost" href="mailto:jyoshnadurgam28@gmail.com">Contact Us</a>
      </div>
      <form id="contactForm">
        <div class="grid-2">
          <div class="field"><label for="cf_name">Name</label><input type="text" id="cf_name" required></div>
          <div class="field"><label for="cf_email">Email</label><input type="email" id="cf_email" required></div>
        </div>
        <div class="field"><label for="cf_subject">Subject</label><input type="text" id="cf_subject" required></div>
        <div class="field"><label for="cf_message">Message</label><textarea id="cf_message" required></textarea></div>
        <div id="contactStatus" style="font-size:0.85rem; margin-bottom:14px;"></div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>` : ''}
    <div class="footer-grid">
      <div>
        <div class="brand" style="cursor:default;"><div class="brand-mark"></div><div class="brand-name">CreditOrbit AI<small>Where Credit Meets Intelligent Navigation.</small></div></div>
      </div>
      <div class="footer-links">
        <a href="#" onclick="return false;">Privacy</a>
        <a href="#" onclick="return false;">Terms</a>
        <a href="mailto:jyoshnadurgam28@gmail.com">Contact</a>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 CreditOrbit AI. All rights reserved.</span><span>jyoshnadurgam28@gmail.com</span></div>
  </div></footer>`;
}

async function handleContactSubmit(e) {
  e.preventDefault();
  const status = document.getElementById('contactStatus');
  const btn = e.target.querySelector('button[type="submit"]');
  const name = document.getElementById('cf_name').value.trim();
  const email = document.getElementById('cf_email').value.trim();
  const subject = document.getElementById('cf_subject').value.trim();
  const message = document.getElementById('cf_message').value.trim();
  if (!name || !email || !subject || !message) return;
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const db = (window.claude && window.claude.use) ? await window.claude.use('db') : null;
    if (db) {
      await db.collection('contact_messages').add({ name, email, subject, message, sentAt: new Date().toISOString() });
      status.style.color = 'var(--good)';
      status.textContent = 'Thank you! Your message has been received.';
      e.target.reset();
    } else {
      status.style.color = 'var(--warn)';
      status.innerHTML = `This site's message backend isn't connected in this view. Please email us directly at <a href="mailto:jyoshnadurgam28@gmail.com" style="color:var(--cyan)">jyoshnadurgam28@gmail.com</a> instead.`;
    }
  } catch (err) {
    status.style.color = 'var(--warn)';
    status.innerHTML = `We couldn't deliver your message right now. Please email us directly at <a href="mailto:jyoshnadurgam28@gmail.com" style="color:var(--cyan)">jyoshnadurgam28@gmail.com</a>.`;
  } finally {
    btn.disabled = false; btn.textContent = 'Send Message';
  }
}

/* ===================== BACKGROUND STARS ===================== */
function renderStars() {
  const field = document.getElementById('orbitField');
  let svg = '<svg xmlns="http://www.w3.org/2000/svg">';
  for (let i=0;i<70;i++) {
    const x = Math.random()*100, y = Math.random()*100, r = Math.random()*1.3+0.3;
    svg += `<circle class="star" cx="${x}%" cy="${y}%" r="${r}"/>`;
  }
  svg += '</svg>';
  field.innerHTML = svg;
}

/* ===================== NAVIGATION ===================== */
const RENDERERS = {1:renderScreen1,2:renderScreen2,3:renderScreen3,4:renderScreen4,5:renderScreen5,6:renderScreen6,7:renderScreen7,8:renderScreen8};

const Nav = {
  go(n) {
    State.screen = n;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('screen-'+n);
    el.innerHTML = RENDERERS[n]();
    el.classList.add('active');
    bindFieldEvents(el);
    if (n === 4) refreshRatios();
    const cf = document.getElementById('contactForm');
    if (cf) cf.addEventListener('submit', handleContactSubmit);
    updateTopbarProgress(n);
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }
};

function updateTopbarProgress(n) {
  const bar = document.getElementById('topbarProgress');
  if (n >= 3 && n <= 6) {
    bar.style.display = 'flex';
    const steps = [3,4,5,6];
    bar.innerHTML = steps.map(s => `<span class="dot ${s<n?'done':''} ${s===n?'active':''}"></span>`).join('');
  } else {
    bar.style.display = 'none';
  }
}

const FormFlow = {
  continueFrom(screen) {
    if (!validateScreen(screen)) return;
    Nav.go(screen+1);
  },
  analyze() {
    const overlay = document.getElementById('loadingOverlay');
    overlay.hidden = false;
    setTimeout(() => {
      State.result = runFullAssessment(State.formData);
      overlay.hidden = true;
      Nav.go(7);
    }, 1300);
  },
  restart() {
    State.formData = {
      age:'', employment_status:'employed', employment_length:'', monthly_income:'',
      dependents:'', education:'bachelors',
      existing_debt:'', loan_amount:'', loan_term:36, num_existing_loans:'', monthly_expenses:'',
      credit_history_length:'', previous_loan_history:'good', missed_payments:'', on_time_payments:'',
      credit_utilization:30, previous_defaults:'', payment_history_rating:3.5,
    };
    State.result = null;
    Nav.go(1);
  }
};

/* ===================== INIT ===================== */
document.addEventListener('DOMContentLoaded', () => {
  renderStars();
  Nav.go(1);
});
</script>
</body>
</html>
